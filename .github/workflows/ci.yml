name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: windows-2025, platform: windows-x64}
          - {os: macos-15-intel, platform: macos-x64}
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python -m pytest
      - run: python -m blex init stage-smoke --name "CI Extension"
      - run: python -m blex stage stage-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: stage-py${{ matrix.python }}-${{ matrix.target.platform }}
          path: stage-smoke/dist/source/
          if-no-files-found: error
          include-hidden-files: true

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: pyrefly check

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: blex-distributions
          path: dist/
          if-no-files-found: error
